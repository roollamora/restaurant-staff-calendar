services:
  - type: web
    name: restaurant-staff-calendar
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: echo "deploy-3-hours-fix" && npm install --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: GITHUB_REPO
        value: roollamora/restaurant-staff-calendar
      - key: GITHUB_TOKEN
        sync: false
      - key: APP_VERSION
        value: "3"
