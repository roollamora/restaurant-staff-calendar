# Triggers a Render deploy when app code changes (not calendar data saves).
# One-time setup: add repo secret RENDER_DEPLOY_HOOK from
# Render → restaurant-staff-calendar → Settings → Deploy Hook.
name: Deploy to Render

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - ".github/workflows/deploy-render.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set — skipping (Render auto-deploy may still run)."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK"
          echo "Render deploy triggered."
